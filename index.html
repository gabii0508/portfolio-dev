<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriela - Développeuse Web</title>
    
    <style>
        /* Fond blanc et texte centré */
        body {
            background-color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;  /* Prend toute la hauteur de la fenêtre */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Style pour le titre principal */
        h1 {
            font-size: 3em;
            color: #4c6ef5;
            margin-bottom: 10px;
        }

        /* Style pour le sous-titre */
        h2 {
            font-size: 1.5em;
            color: #e06d3b;
        }

        /* Style des boutons */
        .cta-btn {
            padding: 15px 25px;
            background-color: #ff7f50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
            margin-top: 20px;
            display: inline-block;
        }

        .cta-btn:hover {
            background-color: #e06d3b;
        }

        /* Espacement entre les boutons */
        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>

    <h1>Bonjour, je suis Gabriela</h1>
    <h2>Développeuse Web</h2>

    <!-- Section des boutons -->
    <div class="buttons">
        <a href="#" class="cta-btn">Télécharger mon CV</a>
        <a href="#apropos" class="cta-btn">À propos de moi</a>
    </div>

</body>
</html>
